<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Estimate</title>

    <link rel="stylesheet" href="estimate.css">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <div class="estimate-container">

        <div class="estimate-header">
            <span class="estimate-small-title">PRAVIN KITCHENS</span>

            <h1>Get Your Free Estimate</h1>

            <p>
                Tell us about your requirements and our team
                will get back to you shortly.
            </p>
        </div>


        <form id="estimateForm" class="estimate-form">

            <!-- Name -->
            <div class="form-group">
                <label for="name">
                    Full Name
                </label>

                <div class="input-box">
                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>
            </div>


            <!-- Phone -->
            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>

                <div class="input-box">
                    <i class="bi bi-telephone"></i>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>
            </div>


            <!-- Service -->
            <div class="form-group">
                <label for="service">
                    Select Service
                </label>

                <div class="input-box">
                    <i class="bi bi-house"></i>

                    <select
                        id="service"
                        name="service"
                        required
                    >
                        <option value="">
                            Select a service
                        </option>

                        <option value="modular-kitchen">
                            Modular Kitchen
                        </option>

                        <option value="interior-designing">
                            Interior Designing
                        </option>

                        <option value="home-interior">
                            Home Interior
                        </option>

                        <option value="wardrobe">
                            Wardrobe
                        </option>

                        <option value="other">
                            Other
                        </option>
                    </select>
                </div>
            </div>


            <!-- Location -->
            <div class="form-group">
                <label for="location">
                    Location
                </label>

                <div class="input-box">
                    <i class="bi bi-geo-alt"></i>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter your location"
                        required
                    >
                </div>
            </div>


            <!-- Message -->
            <div class="form-group">
                <label for="message">
                    Requirements
                </label>

                <div class="textarea-box">
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Tell us about your requirements..."
                    ></textarea>
                </div>
            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="estimate-submit"
            >
                <span>Request Free Estimate</span>

                <i class="bi bi-arrow-right"></i>
            </button>

        </form>

    </div>


    <script>

        /* =========================================
   FREE ESTIMATE POPUP
========================================= */

document.addEventListener("DOMContentLoaded", function () {

    const estimateButtons =
        document.querySelectorAll(".estimate-open-btn");

    const estimateOverlay =
        document.getElementById("estimateOverlay");

    const estimateClose =
        document.getElementById("estimateClose");


    /* =========================================
       OPEN POPUP
    ========================================= */

    estimateButtons.forEach(function (button) {

        button.addEventListener("click", function (event) {

            event.preventDefault();

            estimateOverlay.classList.add("active");

            /* Stop background scrolling */
            document.body.style.overflow = "hidden";

        });

    });


    /* =========================================
       CLOSE POPUP
    ========================================= */

    function closeEstimate() {

        estimateOverlay.classList.remove("active");

        /* Restore scrolling */
        document.body.style.overflow = "";

    }


    estimateClose.addEventListener(
        "click",
        closeEstimate
    );


    /* =========================================
       CLICK OUTSIDE
    ========================================= */

    estimateOverlay.addEventListener(
        "click",
        function (event) {

            if (event.target === estimateOverlay) {

                closeEstimate();

            }

        }
    );


    /* =========================================
       ESC KEY
    ========================================= */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                estimateOverlay.classList.contains("active")
            ) {

                closeEstimate();

            }

        }
    );

});


const estimateForm = document.getElementById("estimateForm");

estimateForm.addEventListener("submit", function (event) {
    event.preventDefault();

    // Get form values
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const service = document.getElementById("service").value;
    const location = document.getElementById("location").value.trim();
    const message = document.getElementById("message").value.trim();

    // Convert service value into readable text
    const serviceText = {
        "modular-kitchen": "Modular Kitchen",
        "interior-designing": "Interior Designing",
        "home-interior": "Home Interior",
        "wardrobe": "Wardrobe",
        "other": "Other"
    };

    const selectedService = serviceText[service] || service;

    // WhatsApp message
    const whatsappMessage =
`*PRAVIN KITCHENS - FREE ESTIMATE REQUEST*

*Customer Details*
━━━━━━━━━━━━━━━━━━

*Name:* ${name}

*Phone:* ${phone}

*Service:* ${selectedService}

*Location:* ${location}

*Requirements:*
${message || "Not specified"}

━━━━━━━━━━━━━━━━━━
Please contact me regarding this estimate request.`;

    // Your Pravin Kitchens WhatsApp number
    const whatsappNumber = "919787769970";

    // Encode message for WhatsApp URL
    const whatsappURL =
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`;

    // Open WhatsApp
    window.open(whatsappURL, "_blank");
});
    </script>

</body>
</html>
